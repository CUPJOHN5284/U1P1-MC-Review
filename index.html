<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AP Statistics Paginated Quiz - Unit 1 Part II: Collecting Data</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --correct-bg: #dcfce7;
      --correct-text: #15803d;
      --correct-border: #86efac;
      --incorrect-bg: #fee2e2;
      --incorrect-text: #b91c1c;
      --incorrect-border: #fca5a5;
      --border: #cbd5e1;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      color: var(--primary);
      margin: 0 0 5px 0;
      font-size: 1.75rem;
    }

    /* Status & Progress Bar */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .progress-container {
      width: 100%;
      background-color: #e2e8f0;
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .progress-bar {
      height: 100%;
      width: 5%;
      background-color: var(--primary);
      transition: width 0.3s ease;
    }

    .category-badge {
      display: inline-block;
      background-color: #dbeafe;
      color: #1e40af;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: bold;
      margin-bottom: 15px;
    }

    /* Page Cards */
    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .question-text {
      font-size: 1.08rem;
      font-weight: 600;
      margin-bottom: 16px;
    }

    /* Tables & Graphic Containers */
    .visual-container {
      margin: 15px 0 20px 0;
      padding: 15px;
      background-color: #f1f5f9;
      border-radius: 8px;
      border: 1px solid var(--border);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: auto;
    }

    .quiz-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      text-align: center;
      background: #ffffff;
    }

    .quiz-table th, .quiz-table td {
      border: 1px solid var(--border);
      padding: 8px 12px;
    }

    .quiz-table th {
      background-color: #e2e8f0;
      font-weight: 600;
    }

    /* Options */
    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .option:hover {
      background-color: #f8fafc;
      border-color: #94a3b8;
    }

    .option input {
      margin-right: 12px;
      transform: scale(1.15);
    }

    /* Feedback */
    .feedback {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      display: none;
      font-size: 0.95rem;
    }

    .feedback.correct {
      background-color: var(--correct-bg);
      color: var(--correct-text);
      border: 1px solid var(--correct-border);
      display: block;
    }

    .feedback.incorrect {
      background-color: var(--incorrect-bg);
      color: var(--incorrect-text);
      border: 1px solid var(--incorrect-border);
      display: block;
    }

    /* Navigation Controls */
    .nav-controls {
      display: flex;
      justify-content: space-between;
      margin-top: 25px;
    }

    .btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
      opacity: 0.7;
    }

    .btn-secondary {
      background-color: #64748b;
    }

    .btn-submit {
      background-color: #059669;
    }

    /* Final Results Card */
    .results-card {
      text-align: center;
      padding: 40px 20px;
    }

    .score-display {
      font-size: 3.2rem;
      font-weight: bold;
      color: var(--primary);
      margin: 15px 0;
    }

    /* Simple Visual Helper Styles */
    .dotplot-visual {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      height: 110px;
      padding-bottom: 20px;
      border-bottom: 2px solid #475569;
    }
    .dot-col {
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      gap: 4px;
    }
    .dot {
      width: 10px;
      height: 10px;
      background-color: var(--primary);
      border-radius: 50%;
    }
    .dot-label {
      margin-top: 6px;
      font-size: 0.8rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>AP Statistics Mastery Quiz</h1>
    <p style="margin: 0; color: #64748b; font-size: 0.95rem;">Unit 1, Part II: Collecting Data</p>
  </header>

  <div class="status-bar" id="status-bar">
    <span id="page-indicator">Question 1 of 20</span>
    <span>Score: <span id="score">0</span> / 20</span>
  </div>

  <div class="progress-container" id="progress-container">
    <div class="progress-bar" id="progress-bar"></div>
  </div>

  <div id="quiz-container"></div>

  <div class="nav-controls" id="nav-controls">
    <button class="btn btn-secondary" id="prev-btn" onclick="prevPage()">Previous</button>
    <button class="btn btn-submit" id="submit-btn" onclick="checkCurrentAnswer()">Submit Answer</button>
    <button class="btn" id="next-btn" onclick="nextPage()">Next</button>
  </div>
</div>

<script>
const questions = [
  // ================= SECTION 1F: INTRODUCTION TO DATA COLLECTION =================
  {
    category: "Section 1F: Introduction to Data Collection",
    q: "Researchers randomly assigned 2,426 volunteers to finish their daily shower with cold water for 0, 30, 60, or 90 seconds to observe sickness rates. What are the explanatory variable, its levels, and the experimental units?",
    visual: `
      <table class="quiz-table">
        <thead>
          <tr><th>Shower Treatment (Factor Level)</th><th>Participants (Experimental Units)</th><th>Response Variable Measured</th></tr>
        </thead>
        <tbody>
          <tr><td>0 seconds cold water</td><td>611 volunteers</td><td>Sickness status reported over 90 days</td></tr>
          <tr><td>30 seconds cold water</td><td>673 volunteers</td><td>Sickness status reported over 90 days</td></tr>
          <tr><td>60 seconds cold water</td><td>595 volunteers</td><td>Sickness status reported over 90 days</td></tr>
          <tr><td>90 seconds cold water</td><td>547 volunteers</td><td>Sickness status reported over 90 days</td></tr>
        </tbody>
      </table>
    `,
    options: [
      "Explanatory: Sickness status (2 levels); Units: 90 days",
      "Explanatory: Cold shower time (4 levels: 0, 30, 60, 90 seconds); Units: 2,426 volunteers",
      "Explanatory: Water temperature; Units: Sickness reports",
      "Explanatory: 2,426 volunteers; Units: Cold water duration"
    ],
    answer: 1,
    explanation: "In an experiment, factors are explanatory variables that are manipulated (cold shower time at 4 levels: 0, 30, 60, and 90 seconds), and human experimental units are called subjects or volunteers (2,426 participants)[cite: 5]."
  },
  {
    category: "Section 1F: Introduction to Data Collection",
    q: "An observational study finds that students who eat family dinners at least 5 times a week have higher GPAs. Why is employment status considered a potential confounding variable?",
    visual: `
      <svg width="320" height="110" viewBox="0 0 320 110">
        <!-- Explanatory -->
        <rect x="10" y="40" width="90" height="35" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
        <text x="55" y="62" font-size="10" text-anchor="middle" font-weight="bold">Family Dinners</text>
        <!-- Response -->
        <rect x="220" y="40" width="90" height="35" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
        <text x="265" y="62" font-size="10" text-anchor="middle" font-weight="bold">GPA (Grades)</text>
        <!-- Confounding Variable -->
        <rect x="115" y="5" width="90" height="30" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
        <text x="160" y="24" font-size="9" text-anchor="middle" font-weight="bold">Employment Status</text>
        <!-- Arrows -->
        <line x1="100" y1="57" x2="220" y2="57" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3"/>
        <line x1="130" y1="35" x2="80" y2="40" stroke="#dc2626" stroke-width="1.5"/>
        <line x1="190" y1="35" x2="240" y2="40" stroke="#dc2626" stroke-width="1.5"/>
      </svg>
    `,
    options: [
      "Employment status is a response variable caused directly by higher GPAs",
      "Employment status is associated with family dinner frequency (unemployed students eat home more) AND associated with GPA (more study time), masking whether dinner frequency causes GPA changes",
      "Employment status is a blocked factor in a completely randomized experiment",
      "Employment status proves a direct cause-and-effect relationship between meals and grades"
    ],
    answer: 1,
    explanation: "A confounding variable is an extraneous variable associated with both the explanatory variable and the response variable, making it impossible to determine if changes in the explanatory variable cause changes in the response[cite: 5]."
  },
  {
    category: "Section 1F: Introduction to Data Collection",
    q: "Which statement correctly distinguishes a prospective observational study from an experiment?",
    visual: null,
    options: [
      "Observational studies deliberately impose treatments, whereas experiments do not",
      "Prospective observational studies track subjects into the future measuring variables without imposing treatments, whereas experiments deliberately impose treatments",
      "Experiments look backward in time to analyze past medical records",
      "Observational studies establish direct cause-and-effect conclusions, whereas experiments do not"
    ],
    answer: 1,
    explanation: "Observational studies observe individuals and measure variables of interest without imposing treatments. Prospective studies select units at a point in time and gather data into the future, while experiments deliberately impose treatments[cite: 5]."
  },
  {
    category: "Section 1F: Introduction to Data Collection",
    q: "What are the three essential components that must be identified in a statistical investigative question involving inference?",
    visual: null,
    options: [
      "Sample size, standard deviation, and p-value threshold",
      "Variable(s) of interest, type of inference (including parameters), and type of conclusion (target population and cause-and-effect evaluation)",
      "Confounding variables, placebo type, and double-blinding strategy",
      "Stratum size, cluster location, and response bias direction"
    ],
    answer: 1,
    explanation: "The three components of an investigative question are: (1) Identify the variable(s) of interest, (2) Identify the type of inference (parameter/claim), and (3) Indicate the type of conclusion (target population & cause-and-effect possibility)[cite: 5]."
  },

  // ================= SECTION 1G: SAMPLING: GOOD AND BAD =================
  {
    category: "Section 1G: Sampling: Good and Bad",
    q: "To choose a simple random sample (SRS) of 3 schools from 19 labeled 1 to 19 using technology, `randInt(1, 19)` outputs: 12, 12, 16, 19. Which schools are selected, and why?",
    visual: null,
    options: [
      "Schools 12, 12, and 16; duplicate integers are kept to preserve equal probability",
      "Schools 12, 16, and 19; the second '12' is ignored because sampling is without replacement",
      "Schools 1, 12, and 19; repeated numbers trigger a automatic reset",
      "Schools 12, 16, 19, and 1; four schools must be chosen if duplicates occur"
    ],
    answer: 1,
    explanation: "When selecting a simple random sample, sampling without replacement is used. Repeated integers are ignored until the required number of distinct observational units is chosen[cite: 5]."
  },
  {
    category: "Section 1G: Sampling: Good and Bad",
    q: "Refer to the diagram comparing Stratified vs. Cluster Random Sampling. Which option correctly describes the ideal composition of strata versus clusters?",
    visual: `
      <svg width="310" height="120" viewBox="0 0 310 120">
        <!-- Stratified -->
        <rect x="10" y="10" width="135" height="100" rx="6" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
        <text x="77" y="28" font-size="10" text-anchor="middle" font-weight="bold" fill="#1e40af">Stratified Sampling</text>
        <rect x="20" y="38" width="115" height="18" fill="#dbeafe" rx="3"/><text x="77" y="51" font-size="8.5" text-anchor="middle">Stratum 1: Similar (Homogeneous)</text>
        <rect x="20" y="62" width="115" height="18" fill="#dbeafe" rx="3"/><text x="77" y="75" font-size="8.5" text-anchor="middle">Stratum 2: Similar (Homogeneous)</text>
        <text x="77" y="98" font-size="8" text-anchor="middle" fill="#64748b">SRS from EACH stratum</text>
        <!-- Cluster -->
        <rect x="165" y="10" width="135" height="100" rx="6" fill="#f8fafc" stroke="#16a34a" stroke-width="1.5"/>
        <text x="232" y="28" font-size="10" text-anchor="middle" font-weight="bold" fill="#15803d">Cluster Sampling</text>
        <rect x="175" y="38" width="115" height="18" fill="#dcfce7" rx="3"/><text x="232" y="51" font-size="8.5" text-anchor="middle">Cluster 1: Mixed (Heterogeneous)</text>
        <rect x="175" y="62" width="115" height="18" fill="#dcfce7" rx="3"/><text x="232" y="75" font-size="8.5" text-anchor="middle">Cluster 2: Mixed (Heterogeneous)</text>
        <text x="232" y="98" font-size="8" text-anchor="middle" fill="#64748b">SRS of clusters (ALL in chosen)</text>
      </svg>
    `,
    options: [
      "Strata should be heterogeneous within; Clusters should be homogeneous within",
      "Strata should be homogeneous within (similar responses); Clusters should be heterogeneous within (mini-representations of the population)",
      "Both strata and clusters must consist of identical individuals",
      "Strata are chosen by location; Clusters are chosen by grade level"
    ],
    answer: 1,
    explanation: "Stratified sampling works best when individuals within each stratum are homogeneous (similar) with large differences between strata. Cluster sampling works best when individuals within each cluster are heterogeneous (mirroring the population)[cite: 5]."
  },
  {
    category: "Section 1G: Sampling: Good and Bad",
    q: "To select a systematic random sample of 80 students from an auditorium containing 800 numbered seats, what fixed interval k is used, and how is the starting point determined?",
    visual: `
      <svg width="300" height="90" viewBox="0 0 300 90">
        <rect x="10" y="10" width="280" height="40" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" rx="4"/>
        <!-- Selected dots -->
        <circle cx="30" cy="30" r="8" fill="#ef4444"/><text x="30" y="33" font-size="9" text-anchor="middle" fill="white">6</text>
        <circle cx="90" cy="30" r="8" fill="#2563eb"/><text x="90" y="33" font-size="9" text-anchor="middle" fill="white">16</text>
        <circle cx="150" cy="30" r="8" fill="#2563eb"/><text x="150" y="33" font-size="9" text-anchor="middle" fill="white">26</text>
        <circle cx="210" cy="30" r="8" fill="#2563eb"/><text x="210" y="33" font-size="9" text-anchor="middle" fill="white">36</text>
        <text x="260" y="33" font-size="12">...</text>
        <text x="150" y="75" font-size="9" text-anchor="middle" font-weight="bold">Interval k = 10 | Random Start = Seat 6</text>
      </svg>
    `,
    options: [
      "Interval k = 80; starting point is seat 1",
      "Interval k = 10 (800 / 80); starting point is a randomly generated integer from 1 to 10",
      "Interval k = 100; starting point is seat 800",
      "Interval k = 8; starting point is seat 80"
    ],
    answer: 1,
    explanation: "Systematic sampling calculates fixed interval k = N / n = 800 / 80 = 10. A random number generator selects a start integer from 1 to 10, and every 10th student thereafter is selected[cite: 5]."
  },
  {
    category: "Section 1G: Sampling: Good and Bad",
    q: "An online poll asks: 'Should the new $300M research ship be named Boaty McBoatface?' Over 124,000 people self-select to vote online. What sampling method is this, and how does it cause bias?",
    visual: null,
    options: [
      "Simple random sample; eliminates bias due to large sample size",
      "Voluntary response sample; people with strong/playful feelings self-select to participate, overrepresenting humorous preferences compared to the population",
      "Stratified sample; ensures equal voting rights across demographic groups",
      "Convenience sample; underestimates support because only scientists voted"
    ],
    answer: 1,
    explanation: "Voluntary response samples consist of people who choose to respond to an open invitation. This leads to voluntary response bias because people with strong feelings are more likely to respond, making the sample unrepresentative[cite: 5]."
  },
  {
    category: "Section 1G: Sampling: Good and Bad",
    q: "A dentist surveys a random sample of 100 clinic patients to estimate the proportion of all U.S. adults who floss daily. What primary source of bias affects this survey?",
    visual: null,
    options: [
      "Nonresponse bias, because clinic patients refuse to answer questions",
      "Undercoverage bias, because adults who do not visit the dentist cannot be chosen and likely floss less often than dental patients",
      "Voluntary response bias, because patients choose when to make dental appointments",
      "Question wording bias, because the question uses confusing dental terminology"
    ],
    answer: 1,
    explanation: "Undercoverage occurs when some members of the population (non-dental patients) cannot be chosen for a sample. If they differ in relevant ways (floss less often), the sample statistic overestimates the population parameter[cite: 5]."
  },
  {
    category: "Section 1G: Sampling: Good and Bad",
    q: "In a phone survey, 96% of adults stated they always wash hands in public restrooms, but an observational study in public restrooms found only 85% actually did. What accounts for this discrepancy?",
    visual: null,
    options: [
      "Nonresponse bias in the observational study",
      "Response bias in the phone survey, as respondents gave socially desirable answers rather than the truth",
      "Undercoverage bias in the restroom observation study",
      "Sampling variability from a completely randomized experiment"
    ],
    answer: 1,
    explanation: "Response bias occurs when responses consistently differ from the truth. People often lie or misremember to present themselves in a favorable light (e.g., reporting good hygiene)[cite: 5]."
  },

  // ================= SECTION 1H: EXPERIMENTAL DESIGN =================
  {
    category: "Section 1H: Experimental Design",
    q: "What are the four fundamental elements of a well-designed experiment?",
    visual: null,
    options: [
      "Hypotheses, Surveys, P-values, and Random Samples",
      "Comparison, Random Assignment, Replication, and Direct Control",
      "Stratification, Clustering, Blinding, and Censusing",
      "Sampling frame, Nonresponse, Response, and Confounding"
    ],
    answer: 1,
    explanation: "The four elements of a well-designed experiment are: (1) Comparison (comparing 2+ treatments), (2) Random Assignment (balancing extraneous variables), (3) Replication (multiple units per treatment), and (4) Direct Control (keeping extraneous variables constant)[cite: 5]."
  },
  {
    category: "Section 1H: Experimental Design",
    q: "In an experiment testing an arthritis medication (ASU), 345 patients were randomly assigned to receive either 300 mg of ASU or an inactive placebo pill for 3 years. What is the main purpose of the placebo control group?",
    visual: null,
    options: [
      "To ensure every participant is cured of arthritis",
      "To provide a baseline for comparison and account for the placebo effect (favorable response to any treatment)",
      "To eliminate the need for random assignment",
      "To reduce the overall sample size required for statistical inference"
    ],
    answer: 1,
    explanation: "A control group provides a baseline for comparing treatment effects. A placebo control group controls for the placebo effect—the fact that subjects often respond favorably to any treatment simply because they expect to improve[cite: 5]."
  },
  {
    category: "Section 1H: Experimental Design",
    q: "A magnetic pain-therapy trial used sealed envelopes containing active or inactive magnets. Neither the patients nor the evaluating doctors knew which magnet each patient received. What type of design is this, and why is it important?",
    visual: null,
    options: [
      "Single-blind; prevents patients from knowing their doctor's identity",
      "Double-blind; prevents patient expectations (placebo effect) AND doctor measurement bias from influencing pain ratings",
      "Observational study; prevents confounding between age and pain level",
      "Matched pairs design; eliminates the need for random assignment"
    ],
    answer: 1,
    explanation: "In a double-blind experiment, neither the subjects nor those interacting with them and measuring the response variable know which treatment a subject received. This prevents subject expectations and observer bias[cite: 5]."
  },
  {
    category: "Section 1H: Experimental Design",
    q: "Pfizer randomly assigned 43,548 volunteers to receive 2 shots of a COVID-19 vaccine or 2 shots of a saline placebo. What is the statistical purpose of random assignment in this experiment?",
    visual: `
      <svg width="320" height="100" viewBox="0 0 320 100">
        <rect x="10" y="35" width="70" height="30" rx="4" fill="#e2e8f0" stroke="#475569"/>
        <text x="45" y="53" font-size="8.5" text-anchor="middle">43,548 Subjects</text>
        <!-- Arrows -->
        <line x1="80" y1="50" x2="120" y2="25" stroke="#2563eb" stroke-width="1.5"/>
        <line x1="80" y1="50" x2="120" y2="75" stroke="#2563eb" stroke-width="1.5"/>
        <text x="100" y="42" font-size="7.5" text-anchor="middle" fill="#2563eb">Random</text>
        <!-- Groups -->
        <rect x="120" y="10" width="80" height="30" rx="4" fill="#dbeafe" stroke="#2563eb"/>
        <text x="160" y="28" font-size="8.5" text-anchor="middle">Group 1: Vaccine</text>
        <rect x="120" y="60" width="80" height="30" rx="4" fill="#fee2e2" stroke="#dc2626"/>
        <text x="160" y="78" font-size="8.5" text-anchor="middle">Group 2: Placebo</text>
        <!-- Compare -->
        <line x1="200" y1="25" x2="240" y2="50" stroke="#64748b" stroke-width="1.5"/>
        <line x1="200" y1="75" x2="240" y2="50" stroke="#64748b" stroke-width="1.5"/>
        <rect x="240" y="35" width="70" height="30" rx="4" fill="#dcfce7" stroke="#16a34a"/>
        <text x="275" y="53" font-size="8.5" text-anchor="middle">Compare Infection</text>
      </svg>
    `,
    options: [
      "To select a sample that represents all global populations",
      "To create treatment groups that are roughly equivalent in extraneous variables prior to receiving treatments, allowing cause-and-effect conclusions",
      "To guarantee that exactly 50% of the world population gets vaccinated",
      "To eliminate nonresponse bias among clinical trial subjects"
    ],
    answer: 1,
    explanation: "Random assignment uses chance to assign units to treatments. This creates roughly equivalent treatment groups by balancing extraneous variables among groups, allowing for cause-and-effect conclusions[cite: 5]."
  },
  {
    category: "Section 1H: Experimental Design",
    q: "In a lecture multitasking study, ALL 40 student participants attended the exact same lecture and took the exact same final test. What is the benefit of directly controlling these variables?",
    visual: null,
    options: [
      "It eliminates the need for a control group",
      "It avoids confounding and reduces variation in test scores, making it easier to determine if multitasking affects learning",
      "It allows researchers to generalize results to all humans worldwide",
      "It transforms an experiment into a retrospective observational study"
    ],
    answer: 1,
    explanation: "Direct control keeps extraneous variables constant for all experimental units. This avoids confounding and reduces variability in the response variable, making treatment effects easier to detect[cite: 5]."
  },
  {
    category: "Section 1H: Experimental Design",
    q: "Blackberry yield experiment: 10 planting spaces are split between 2 fields (4 in a highly fertile field, 6 in a less fertile field). How should a Randomized Block Design be implemented?",
    visual: `
      <svg width="320" height="110" viewBox="0 0 320 110">
        <!-- Block 1 -->
        <rect x="10" y="10" width="140" height="42" rx="4" fill="#f1f5f9" stroke="#2563eb"/>
        <text x="80" y="24" font-size="8.5" text-anchor="middle" font-weight="bold">Block 1: More Fertile (n=4)</text>
        <text x="80" y="40" font-size="8" text-anchor="middle">Random Assign: 2 New, 2 Current</text>
        <!-- Block 2 -->
        <rect x="10" y="58" width="140" height="42" rx="4" fill="#f1f5f9" stroke="#16a34a"/>

let currentPage = 0;
let score = 0;
let userAnswers = new Array(questions.length).fill(null);
let answeredStatus = new Array(questions.length).fill(false);

function renderQuiz() {
  const container = document.getElementById("quiz-container");
  container.innerHTML = "";

  questions.forEach((qObj, index) => {
    const page = document.createElement("div");
    page.className = `page ${index === 0 ? "active" : ""}`;
    page.id = `page-${index}`;

    let visualHTML = qObj.visual ? `<div class="visual-container">${qObj.visual}</div>` : "";

    let optionsHTML = "";
    qObj.options.forEach((opt, optIdx) => {
      optionsHTML += `
        <label class="option">
          <input type="radio" name="q-${index}" value="${optIdx}" onchange="selectOption(${index}, ${optIdx})">
          ${opt}
        </label>
      `;
    });

    page.innerHTML = `
      <div class="card">
        <span class="category-badge">${qObj.category}</span>
        <div class="question-text">${index + 1}. ${qObj.q}</div>
        ${visualHTML}
        <div class="options">${optionsHTML}</div>
        <div class="feedback" id="feedback-${index}"></div>
      </div>
    `;

    container.appendChild(page);
  });

  updatePageUI();
}

function selectOption(qIndex, optIndex) {
  if (!answeredStatus[qIndex]) {
    userAnswers[qIndex] = optIndex;
  }
}

function checkCurrentAnswer() {
  const qObj = questions[currentPage];
  const selected = userAnswers[currentPage];
  const feedbackEl = document.getElementById(`feedback-${currentPage}`);

  if (selected === null) {
    alert("Please select an answer first!");
    return;
  }

  if (answeredStatus[currentPage]) return;
  answeredStatus[currentPage] = true;

  if (selected === qObj.answer) {
    score++;
    feedbackEl.className = "feedback correct";
    feedbackEl.innerHTML = `<strong>Correct!</strong> ${qObj.explanation}`;
  } else {
    feedbackEl.className = "feedback incorrect";
    feedbackEl.innerHTML = `
      <strong>Incorrect.</strong><br>
      <strong>Your Choice:</strong> ${qObj.options[selected]}<br>
      <strong>Correct Answer:</strong> ${qObj.options[qObj.answer]}<br><br>
      <strong>Explanation:</strong> ${qObj.explanation}
    `;
  }

  // Lock options for this page
  const card = document.getElementById(`page-${currentPage}`);
  const inputs = card.querySelectorAll('input[type="radio"]');
  inputs.forEach(input => input.disabled = true);

  // Update Scoreboard & Navigation UI
  document.getElementById("score").innerText = score;
  updatePageUI();
}

function updatePageUI() {
  // Update progress
  document.getElementById("page-indicator").innerText = `Question ${currentPage + 1} of ${questions.length}`;
  const progressPercent = ((currentPage + 1) / questions.length) * 100;
  document.getElementById("progress-bar").style.width = `${progressPercent}%`;

  // Buttons
  document.getElementById("prev-btn").disabled = currentPage === 0;

  const submitBtn = document.getElementById("submit-btn");
  submitBtn.disabled = answeredStatus[currentPage];

  const nextBtn = document.getElementById("next-btn");
  if (currentPage === questions.length - 1) {
    nextBtn.innerText = "Finish Quiz";
  } else {
    nextBtn.innerText = "Next Question";
  }
}

function nextPage() {
  if (currentPage < questions.length - 1) {
    document.getElementById(`page-${currentPage}`).classList.remove("active");
    currentPage++;
    document.getElementById(`page-${currentPage}`).classList.add("active");
    updatePageUI();
  } else {
    showFinalResults();
  }
}

function prevPage() {
  if (currentPage > 0) {
    document.getElementById(`page-${currentPage}`).classList.remove("active");
    currentPage--;
    document.getElementById(`page-${currentPage}`).classList.add("active");
    updatePageUI();
  }
}

function showFinalResults() {
  document.getElementById("status-bar").style.display = "none";
  document.getElementById("progress-container").style.display = "none";
  document.getElementById("nav-controls").style.display = "none";

  const container = document.getElementById("quiz-container");
  const percent = Math.round((score / questions.length) * 100);

  container.innerHTML = `
    <div class="card results-card">
      <h2>Quiz Finished! 🎉</h2>
      <p>Here is your overall performance on <strong>Unit 1, Part II: Collecting Data</strong>:</p>
      <div class="score-display">${score} / ${questions.length}</div>
      <p><strong>Total Percentage:</strong> ${percent}%</p>
      <button class="btn" onclick="location.reload()" style="margin-top:20px;">Retake Quiz</button>
    </div>
  `;
}

// Initialize quiz
window.onload = renderQuiz;
</script>
